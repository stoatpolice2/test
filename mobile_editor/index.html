<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Web Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ヘッダー / 操作バー -->
  <header class="toolbar">
    <div class="tabs">
      <button id="btn-tab-editor" class="tab-btn active">エディタ</button>
      <button id="btn-tab-preview" class="tab-btn">プレビュー</button>
    </div>
    <div class="actions">
      <button id="btn-theme" class="icon-btn" title="テーマ切り替え">🌙</button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="content-area">
    <!-- エディタ画面 -->
    <section id="editor-screen" class="screen active">
      <div class="editor-tools">
        <button id="btn-undo">元に戻す</button>
        <button id="btn-redo">やり直し</button>
        <button id="btn-copy">全文コピー</button>
      </div>
      <textarea id="code-editor" placeholder="ここにHTML/CSS/JSコードをペーストしてください..." spellcheck="false"></textarea>
    </section>

    <!-- プレビュー画面 -->
    <section id="preview-screen" class="screen">
      <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
