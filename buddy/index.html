<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカツキ皇子伝 - バディバトルRPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ゲーム全体を囲むコンテナ -->
  <div id="game-container">

    <!-- 1. ステージ・バトル表示エリア -->
    <div id="battle-field">
      
      <!-- 敵エリア -->
      <div id="enemy-area">
        <div class="status-badge" id="enemy-status">
          <span class="name">ゴブリンリーダー</span>
          <div class="hp-bar-container">
            <div class="hp-bar" id="enemy-hp-bar" style="width: 100%;"></div>
          </div>
          <span class="hp-text" id="enemy-hp-text">HP: 150 / 150</span>
        </div>
        <!-- 敵のダミー画像（あとで差し替え可能） -->
        <img id="enemy-image" src="images/eagle.webp" alt="敵モンスター">
      </div>

      <!-- 味方（マモル＆ススム）エリア -->
      <div id="party-area">
        <!-- マモル -->
        <div class="character-box" id="char-mamoru">
          <div class="status-badge">
            <span class="name">マモル (剣士)</span>
            <div class="hp-bar-container">
              <div class="hp-bar" id="mamoru-hp-bar" style="width: 100%;"></div>
            </div>
            <span class="hp-text" id="mamoru-hp-text">HP: 120 / 120</span>
          </div>
          <img class="chara-img" src="images/mamoru01.webp" alt="マモル">
        </div>

        <!-- ススム -->
        <div class="character-box" id="char-susumu">
          <div class="status-badge">
            <span class="name">ススム (僧侶)</span>
            <div class="hp-bar-container">
              <div class="hp-bar" id="susumu-hp-bar" style="width: 100%;"></div>
            </div>
            <span class="hp-text" id="susumu-hp-text">HP: 80 / 80</span>
          </div>
          <img class="chara-img" src="images/susumu01.webp" alt="ススム">
        </div>
      </div>

    </div>

    <!-- 2. 会話・メッセージログエリア -->
    <div id="message-window">
      <p id="message-text">モンスターが現れた！ マモルとススムのターンです。</p>
    </div>

    <!-- 3. コマンド・アクション選択エリア -->
    <div id="command-window">
      <!-- 行動キャラクター切り替え用のタブ -->
      <div id="command-header">
        <span class="active-turn">行動選択: マモル</span>
      </div>

      <!-- コマンドボタン一覧 -->
      <div id="command-buttons">
        <button class="btn" id="btn-attack">通常攻撃</button>
        <button class="btn btn-skill" id="btn-skill1">火連斬</button>
        <button class="btn btn-skill" id="btn-skill2">剣豪の構え</button>
        <button class="btn btn-special" id="btn-ultimate">【必殺】ライジングストライク</button>
      </div>
    </div>

  </div>

</body>
</html>
