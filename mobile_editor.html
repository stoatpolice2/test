<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>スマホ専用 フルスクリーン エディタ</title>
  <style>
    :root {
      --bg: #edf3fb;
      --bg-2: #e8eef8;
      --panel: rgba(255,255,255,0.96);
      --panel-soft: #f4f7fb;
      --panel-strong: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d9e1ee;
      --accent: #4f76ff;
      --accent-soft: rgba(79,118,255,0.12);
      --editor-bg: #f8fafd;
      --preview-bg: #ffffff;
      --shadow: rgba(31,41,55,0.12);
    }

    body[data-theme="dark"] {
      --bg: #0f172a;
      --bg-2: #0f1b2e;
      --panel: rgba(17,24,39,0.96);
      --panel-soft: #172336;
      --panel-strong: #111827;
      --text: #e6edf8;
      --muted: #a0aec0;
      --line: #2d3b51;
      --accent: #82a7ff;
      --accent-soft: rgba(130,167,255,0.14);
      --editor-bg: #111b2d;
      --preview-bg: #0b1220;
      --shadow: rgba(2,6,23,0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79,118,255,0.08), transparent 28%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
      padding: 0;
    }

    button, textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 54px;
      padding: 6px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 12px var(--shadow);
      backdrop-filter: blur(8px);
      z-index: 20;
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }

    .brand {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), #7dd3fc);
      color: white;
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(79,118,255,0.24);
    }

    .brand-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
      padding: 3px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      padding: 7px 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 68px;
      line-height: 1;
      flex: 1;
      text-align: center;
    }

    .tab.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(79,118,255,0.08);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
      user-select: none;
      padding: 0;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .icon-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      border-color: var(--line);
    }

    .icon-btn.primary {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    .panels {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
      height: 100%;
      background: var(--panel);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
      padding: 6px 10px;
      background: linear-gradient(180deg, var(--panel-soft), rgba(255,255,255,0));
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .panel-header .header-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      background: var(--editor-bg);
      overflow: hidden;
    }

    textarea {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      background: transparent;
      color: var(--text);
      padding: 12px 12px 14px;
      font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
      font-size: 0.92rem;
      line-height: 1.65;
      letter-spacing: 0.01em;
      outline: none;
      tab-size: 2;
      overflow: auto;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .preview-shell {
      flex: 1;
      min-height: 0;
      background: var(--preview-bg);
      padding: 10px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }

    .app[data-active-tab="editor"] .preview-panel {
      display: none;
    }

    .app[data-active-tab="preview"] .editor-panel {
      display: none;
    }

    @media (min-width: 768px) {
      .app {
        max-width: 1500px;
        margin: 0 auto;
      }

      .toolbar {
        padding-left: 14px;
        padding-right: 14px;
      }

      .panel-header {
        padding-left: 14px;
        padding-right: 14px;
      }

      textarea {
        padding-left: 14px;
        padding-right: 14px;
      }
    }

    @media (max-width: 767px) {
      .toolbar {
        min-height: 52px;
      }

      .brand-label {
        display: none;
      }

      .tab {
        min-width: 0;
        flex: 1;
      }

      .icon-btn {
        width: 28px;
        height: 28px;
      }

      .panel-header {
        min-height: 32px;
      }

      .preview-shell {
        padding: 8px;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="app" id="app" data-active-tab="editor">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="brand">E</div>
        <div class="brand-label">Editor</div>
      </div>

      <div class="tabs" role="tablist" aria-label="画面切替">
        <button class="tab is-active" data-tab="editor" role="tab" aria-selected="true" aria-controls="editor-panel">
          編集
        </button>
        <button class="tab" data-tab="preview" role="tab" aria-selected="false" aria-controls="preview-panel">
          確認
        </button>
      </div>

      <div class="actions">
        <button id="undoBtn" class="icon-btn" title="元に戻す" aria-label="元に戻す">🔙</button>
        <button id="redoBtn" class="icon-btn" title="やり直し" aria-label="やり直し">🔜</button>
        <button id="copyBtn" class="icon-btn primary" title="全文をコピー" aria-label="全文をコピー">📝</button>
        <button id="clearBtn" class="icon-btn" title="コードをすべて削除" aria-label="コードをすべて削除">✖</button>
        <button id="themeBtn" class="icon-btn" title="テーマ切替" aria-label="テーマ切替">🌙</button>
      </div>
    </header>

    <main class="panels">
      <section class="panel editor-panel" id="editor-panel" aria-label="編集画面">
        <div class="panel-header">
          <span>HTML / CSS / JS</span>
          <span class="header-tag" id="statusTag">編集中</span>
        </div>

        <div class="editor-wrap">
          <textarea id="editor" spellcheck="false" aria-label="コード入力欄" placeholder="既存のHTML/CSS/JSを貼り付けてください"></textarea>
        </div>
      </section>

      <section class="panel preview-panel" id="preview-panel" aria-label="確認画面">
        <div class="panel-header">
          <span>プレビュー</span>
          <span class="header-tag">Live</span>
        </div>

        <div class="preview-shell">
          <iframe id="previewFrame" title="プレビュー"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "smartphone-fullscreen-editor-v1";
      const DEFAULT_CODE = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8faff);
      color: #1f2937;
    }

    .card {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.96);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 36px rgba(37,99,235,0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      line-height: 1.8;
      color: #4b5563;
      font-size: 1rem;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>スマホ専用フルスクリーン版</h1>
    <p>ここに既存のHTMLコードを貼り付けて、部分編集やデザイン確認ができます。</p>
    <a class="button" href="#">サンプルボタン</a>
  </div>
</body>
</html>`;

      const app = document.getElementById("app");
      const editor = document.getElementById("editor");
      const previewFrame = document.getElementById("previewFrame");
      const undoBtn = document.getElementById("undoBtn");
      const redoBtn = document.getElementById("redoBtn");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");
      const themeBtn = document.getElementById("themeBtn");
      const statusTag = document.getElementById("statusTag");
      const tabs = [...document.querySelectorAll(".tab")];

      const state = {
        code: DEFAULT_CODE,
        theme: "light",
        activeTab: "editor",
        history: [],
        historyIndex: -1
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const saved = JSON.parse(raw);
          if (typeof saved.code === "string") state.code = saved.code;
          if (saved.theme === "dark") state.theme = "dark";
          if (saved.activeTab === "preview") state.activeTab = "preview";
        } catch (error) {
          console.warn("保存データの読込に失敗しました", error);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            code: state.code,
            theme: state.theme,
            activeTab: state.activeTab
          }));
        } catch (error) {
          console.warn("保存に失敗しました", error);
        }
      }

      function updateThemeUI() {
        document.body.setAttribute("data-theme", state.theme);
        themeBtn.textContent = state.theme === "dark" ? "☀️" : "🌙";
        themeBtn.title = state.theme === "dark" ? "ライトモードに切り替え" : "ダークモードに切り替え";
      }

      function setActiveTab(tab) {
        state.activeTab = tab;
        app.setAttribute("data-active-tab", tab);

        tabs.forEach((button) => {
          const isActive = button.dataset.tab === tab;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-selected", String(isActive));
        });

        saveState();
      }

      function updateButtons() {
        undoBtn.disabled = state.historyIndex <= 0;
        redoBtn.disabled = state.historyIndex >= state.history.length - 1;
      }

      function pushHistory(nextCode) {
        if (state.history[state.historyIndex] === nextCode) return;

        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(nextCode);

        if (state.history.length > 120) {
          state.history.shift();
        }

        state.historyIndex = state.history.length - 1;
        updateButtons();
      }

      function applyHistory(index) {
        state.historyIndex = index;
        state.code = state.history[index];
        editor.value = state.code;
        renderPreview();
        saveState();
        updateButtons();
      }

      function renderPreview() {
        previewFrame.srcdoc = state.code;
      }

      async function copyAll() {
        const text = state.code;

        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "✅";
          setTimeout(() => {
            copyBtn.textContent = "📝";
          }, 900);
        } catch (error) {
          editor.focus();
          editor.select();
          document.execCommand("copy");
          copyBtn.textContent = "✅";
          setTimeout(() => {
            copyBtn.textContent = "📝";
          }, 900);
        }
      }

      function clearAll() {
        state.code = "";
        editor.value = "";
        renderPreview();
        pushHistory("");
        saveState();
        setStatus("削除済み");
      }

      function setStatus(text) {
        statusTag.textContent = text;
      }

      function init() {
        loadState();

        state.history = [state.code];
        state.historyIndex = 0;

        editor.value = state.code;
        updateThemeUI();
        setActiveTab(state.activeTab);
        renderPreview();
        updateButtons();

        editor.addEventListener("input", () => {
          const nextCode = editor.value;
          state.code = nextCode;
          pushHistory(nextCode);
          renderPreview();
          saveState();
          setStatus("編集中");
        });

        editor.addEventListener("focus", () => {
          setStatus("編集中");
        });

        editor.addEventListener("blur", () => {
          setStatus("保存済み");
        });

        undoBtn.addEventListener("click", () => {
          if (state.historyIndex <= 0) return;
          applyHistory(state.historyIndex - 1);
          setStatus("戻しました");
        });

        redoBtn.addEventListener("click", () => {
          if (state.historyIndex >= state.history.length - 1) return;
          applyHistory(state.historyIndex + 1);
          setStatus("やり直しました");
        });

        copyBtn.addEventListener("click", async () => {
          await copyAll();
          setStatus("コピー済み");
        });

        clearBtn.addEventListener("click", () => {
          clearAll();
        });

        themeBtn.addEventListener("click", () => {
          state.theme = state.theme === "dark" ? "light" : "dark";
          updateThemeUI();
          saveState();
        });

        tabs.forEach((button) => {
          button.addEventListener("click", () => {
            setActiveTab(button.dataset.tab);
          });
        });

        window.addEventListener("beforeunload", saveState);
      }

      init();
    })();
  </script>
</body>
</html>
