<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Mobile Page Editor</title>
  <style>
    :root {
      --bg: #edf2f8;
      --panel: rgba(255,255,255,0.88);
      --panel-strong: #ffffff;
      --panel-soft: #f4f7fb;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dfe7f3;
      --accent: #5b7cff;
      --accent-soft: rgba(91,124,255,0.12);
      --shadow: rgba(15, 23, 42, 0.08);
      --editor-bg: #f8fafc;
      --preview-bg: #ffffff;
    }

    body[data-theme="dark"] {
      --bg: #0f172a;
      --panel: rgba(17,24,39,0.9);
      --panel-strong: #111827;
      --panel-soft: #172336;
      --text: #edf3ff;
      --muted: #a0aec0;
      --line: #2d3b51;
      --accent: #8aa7ff;
      --accent-soft: rgba(138,167,255,0.14);
      --shadow: rgba(2, 6, 23, 0.42);
      --editor-bg: #101c2d;
      --preview-bg: #0b1220;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    body {
      padding: 10px;
    }

    button, textarea {
      font: inherit;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 20px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 8px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px var(--shadow);
      position: sticky;
      top: 8px;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .brand {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #7dd3fc);
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(91,124,255,0.2);
    }

    .brand-name {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      gap: 4px;
      padding: 3px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-width: 0;
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      min-width: 72px;
      transition: all 0.2s ease;
    }

    .tab.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(91,124,255,0.06);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .icon-btn.primary {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    .icon-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      border-color: var(--line);
    }

    .panels {
      display: block;
      flex: 1;
      min-height: 0;
    }

    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 18px var(--shadow);
      overflow: hidden;
      min-height: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .header-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .editor-panel {
      display: flex;
      flex-direction: column;
    }

    .editor-wrap {
      background: var(--editor-bg);
      flex: 1;
      min-height: 0;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 360px;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 12px 12px 14px;
      font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      outline: none;
      tab-size: 2;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .preview-shell {
      background: var(--preview-bg);
      padding: 8px;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 380px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }

    .app[data-active-tab="editor"] .editor-panel {
      display: flex;
    }

    .app[data-active-tab="preview"] .preview-panel {
      display: flex;
    }

    @media (min-width: 900px) {
      body {
        padding: 14px;
      }

      .panel {
        display: flex !important;
      }

      .app[data-active-tab="editor"] .editor-panel,
      .app[data-active-tab="preview"] .preview-panel {
        display: flex;
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(0, 1.02fr) minmax(0, 1.38fr);
        gap: 10px;
      }

      .editor-panel, .preview-panel {
        flex-direction: column;
      }

      textarea {
        min-height: 500px;
      }

      iframe {
        min-height: 500px;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="app" id="app" data-active-tab="editor">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="brand">E</div>
        <div class="brand-name">Edit</div>
      </div>

      <div class="tabs" role="tablist" aria-label="画面切替">
        <button class="tab is-active" data-tab="editor" role="tab" aria-selected="true">
          編集
        </button>
        <button class="tab" data-tab="preview" role="tab" aria-selected="false">
          プレビュー
        </button>
      </div>

      <div class="actions">
        <button id="undoBtn" class="icon-btn" title="元に戻す" aria-label="元に戻す">🔙</button>
        <button id="redoBtn" class="icon-btn" title="やり直し" aria-label="やり直し">🔜</button>
        <button id="copyBtn" class="icon-btn primary" title="全文をコピー" aria-label="全文をコピー">📝</button>
        <button id="themeBtn" class="icon-btn" title="ダークモード切替" aria-label="ダークモード切替">🌙</button>
      </div>
    </header>

    <main class="panels">
      <section class="panel editor-panel" id="editor-panel" aria-label="編集画面">
        <div class="panel-header">
          <span>HTML / CSS / JS</span>
          <span class="header-tag" id="statusTag">編集中</span>
        </div>
        <div class="editor-wrap">
          <textarea id="editor" spellcheck="false" aria-label="コード入力欄" placeholder="既存のHTML/CSS/JSを貼り付けてください"></textarea>
        </div>
      </section>

      <section class="panel preview-panel" id="preview-panel" aria-label="プレビュー画面">
        <div class="panel-header">
          <span>プレビュー</span>
          <span class="header-tag">Live</span>
        </div>
        <div class="preview-shell">
          <iframe id="previewFrame" title="プレビュー"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "mini-mobile-page-editor-v1";

      const DEFAULT_CODE = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 32px 18px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #edf4ff, #f7f9ff);
      color: #1f2937;
    }

    .card {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.96);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.10);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      line-height: 1.8;
      color: #4b5563;
      font-size: 1rem;
    }

    .btn {
      display: inline-block;
      margin-top: 18px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ミニマル編集ツール</h1>
    <p>ここに既存のHTMLコードを貼り付けて、部分編集やデザイン確認を行えます。</p>
    <a class="btn" href="#">サンプルボタン</a>
  </div>
</body>
</html>`;

      const app = document.getElementById("app");
      const editor = document.getElementById("editor");
      const previewFrame = document.getElementById("previewFrame");
      const undoBtn = document.getElementById("undoBtn");
      const redoBtn = document.getElementById("redoBtn");
      const copyBtn = document.getElementById("copyBtn");
      const themeBtn = document.getElementById("themeBtn");
      const statusTag = document.getElementById("statusTag");
      const tabs = [...document.querySelectorAll(".tab")];

      const state = {
        code: DEFAULT_CODE,
        theme: "light",
        activeTab: "editor",
        history: [],
        historyIndex: -1
      };

      function loadState() {
        try {
          const savedRaw = localStorage.getItem(STORAGE_KEY);
          if (!savedRaw) return;

          const saved = JSON.parse(savedRaw);
          if (typeof saved.code === "string") state.code = saved.code;
          if (saved.theme === "dark") state.theme = "dark";
          if (saved.activeTab === "preview") state.activeTab = "preview";
        } catch (error) {
          console.warn("保存データの読込に失敗しました", error);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            code: state.code,
            theme: state.theme,
            activeTab: state.activeTab
          }));
        } catch (error) {
          console.warn("保存に失敗しました", error);
        }
      }

      function updateThemeUI() {
        document.body.setAttribute("data-theme", state.theme);
        themeBtn.textContent = state.theme === "dark" ? "☀️" : "🌙";
        themeBtn.title = state.theme === "dark" ? "ライトモードに切り替え" : "ダークモードに切り替え";
      }

      function setActiveTab(tab) {
        state.activeTab = tab;
        app.setAttribute("data-active-tab", tab);

        tabs.forEach((button) => {
          const isActive = button.dataset.tab === tab;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-selected", String(isActive));
        });

        saveState();
      }

      function updateButtons() {
        undoBtn.disabled = state.historyIndex <= 0;
        redoBtn.disabled = state.historyIndex >= state.history.length - 1;
      }

      function pushHistory(nextCode) {
        if (state.history[state.historyIndex] === nextCode) return;

        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(nextCode);

        if (state.history.length > 120) {
          state.history.shift();
        }

        state.historyIndex = state.history.length - 1;
        updateButtons();
      }

      function applyHistory(index) {
        state.historyIndex = index;
        state.code = state.history[index];
        editor.value = state.code;
        renderPreview();
        saveState();
        updateButtons();
      }

      function renderPreview() {
        previewFrame.srcdoc = state.code;
      }

      async function copyAll() {
        const text = state.code;

        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "✅";
          setTimeout(() => { copyBtn.textContent = "📝"; }, 900);
        } catch (error) {
          editor.focus();
          editor.select();
          document.execCommand("copy");
          copyBtn.textContent = "✅";
          setTimeout(() => { copyBtn.textContent = "📝"; }, 900);
        }
      }

      function setStatus(text) {
        statusTag.textContent = text;
      }

      function init() {
        loadState();

        state.history = [state.code];
        state.historyIndex = 0;

        editor.value = state.code;
        updateThemeUI();
        setActiveTab(state.activeTab);
        renderPreview();
        updateButtons();

        editor.addEventListener("input", () => {
          const nextCode = editor.value;
          state.code = nextCode;
          pushHistory(nextCode);
          renderPreview();
          saveState();
          setStatus("編集中");
        });

        editor.addEventListener("focus", () => setStatus("編集中"));
        editor.addEventListener("blur", () => setStatus("保存済み"));

        undoBtn.addEventListener("click", () => {
          if (state.historyIndex <= 0) return;
          applyHistory(state.historyIndex - 1);
          setStatus("戻しました");
        });

        redoBtn.addEventListener("click", () => {
          if (state.historyIndex >= state.history.length - 1) return;
          applyHistory(state.historyIndex + 1);
          setStatus("やり直しました");
        });

        copyBtn.addEventListener("click", async () => {
          await copyAll();
          setStatus("コピー済み");
        });

        themeBtn.addEventListener("click", () => {
          state.theme = state.theme === "dark" ? "light" : "dark";
          updateThemeUI();
          saveState();
        });

        tabs.forEach((button) => {
          button.addEventListener("click", () => {
            setActiveTab(button.dataset.tab);
          });
        });

        window.addEventListener("beforeunload", saveState);
      }

      init();
    })();
  </script>
</body>
</html>
