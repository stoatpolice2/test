<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Page Editor</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-2: #eef3ff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d8e0ef;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.12);
      --shadow: rgba(15, 23, 42, 0.12);
      --success: #22c55e;
      --preview-bg: #ffffff;
    }

    body[data-theme="dark"] {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #182235;
      --text: #e5edf9;
      --muted: #9aa9be;
      --line: #2b3a52;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.18);
      --shadow: rgba(2, 6, 23, 0.45);
      --success: #4ade80;
      --preview-bg: #0b1220;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    body {
      padding: 16px;
    }

    button, textarea {
      font: inherit;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 10px 24px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .tabs {
      display: inline-flex;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 88px;
    }

    .tab.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.15);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .icon-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .icon-btn.primary {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }

    .panels {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.45fr);
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 24px var(--shadow);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 0.95rem;
    }

    .editor-panel {
      min-height: 320px;
    }

    textarea {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      background: transparent;
      color: var(--text);
      padding: 16px;
      font-size: 0.96rem;
      line-height: 1.55;
      outline: none;
      tab-size: 2;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .preview-panel {
      min-height: 320px;
    }

    .preview-shell {
      flex: 1;
      background: var(--preview-bg);
      padding: 16px;
      min-height: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }

    @media (max-width: 899px) {
      body {
        padding: 12px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .tabs {
        width: 100%;
        justify-content: center;
      }

      .actions {
        justify-content: flex-end;
      }

      .panels {
        display: block;
      }

      .panel {
        display: none;
      }

      .app[data-active-tab="editor"] .editor-panel {
        display: flex;
      }

      .app[data-active-tab="preview"] .preview-panel {
        display: flex;
      }
    }

    @media (min-width: 900px) {
      .app[data-active-tab="editor"] .preview-panel,
      .app[data-active-tab="preview"] .editor-panel {
        opacity: 1;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="app" id="app" data-active-tab="editor">
    <header class="toolbar">
      <div class="tabs" role="tablist" aria-label="画面切替">
        <button class="tab is-active" data-tab="editor" role="tab" aria-selected="true" aria-controls="editor-panel">
          ✍️ 編集
        </button>
        <button class="tab" data-tab="preview" role="tab" aria-selected="false" aria-controls="preview-panel">
          🔍 プレビュー
        </button>
      </div>

      <div class="actions">
        <button id="undoBtn" class="icon-btn" title="元に戻す" aria-label="元に戻す">🔙</button>
        <button id="redoBtn" class="icon-btn" title="やり直し" aria-label="やり直し">🔜</button>
        <button id="copyBtn" class="icon-btn primary" title="全文をコピー" aria-label="全文をコピー">📝</button>
        <button id="themeBtn" class="icon-btn" title="ダークモード切替" aria-label="ダークモード切替">🌙</button>
      </div>
    </header>

    <main class="panels">
      <section class="panel editor-panel" id="editor-panel" aria-label="編集画面">
        <div class="panel-header">HTML / CSS / JS</div>
        <textarea id="editor" spellcheck="false" aria-label="コード入力欄" placeholder="ここに既存コードを貼り付けてください"></textarea>
      </section>

      <section class="panel preview-panel" id="preview-panel" aria-label="プレビュー画面">
        <div class="panel-header">プレビュー</div>
        <div class="preview-shell">
          <iframe id="previewFrame" title="プレビュー"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "simple-page-editor-state-v1";

      const DEFAULT_CODE = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 32px 18px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f6f8ff);
      color: #1f2937;
    }
    .card {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 18px 48px rgba(37, 99, 235, 0.12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
    }
    p {
      line-height: 1.8;
      color: #4b5563;
      font-size: 1rem;
    }
    .button {
      display: inline-block;
      margin-top: 18px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>スマホ向けプレビュー</h1>
    <p>ここに既存のHTMLコードを貼り付けて、部分的な編集やデザイン確認を行えます。</p>
    <a class="button" href="#">サンプルボタン</a>
  </div>
</body>
</html>`;

      const app = document.getElementById("app");
      const editor = document.getElementById("editor");
      const previewFrame = document.getElementById("previewFrame");
      const undoBtn = document.getElementById("undoBtn");
      const redoBtn = document.getElementById("redoBtn");
      const copyBtn = document.getElementById("copyBtn");
      const themeBtn = document.getElementById("themeBtn");
      const tabs = [...document.querySelectorAll(".tab")];

      const state = {
        code: DEFAULT_CODE,
        theme: "light",
        activeTab: "editor",
        history: [],
        historyIndex: -1
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const saved = JSON.parse(raw);
          state.code = typeof saved.code === "string" ? saved.code : DEFAULT_CODE;
          state.theme = saved.theme === "dark" ? "dark" : "light";
          state.activeTab = saved.activeTab === "preview" ? "preview" : "editor";
        } catch (error) {
          console.warn("保存データの読込に失敗しました", error);
        }
      }

      function saveState() {
        try {
          const payload = {
            code: state.code,
            theme: state.theme,
            activeTab: state.activeTab
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (error) {
          console.warn("保存に失敗しました", error);
        }
      }

      function updateThemeUI() {
        document.body.setAttribute("data-theme", state.theme);
        themeBtn.textContent = state.theme === "dark" ? "☀️" : "🌙";
        themeBtn.title = state.theme === "dark" ? "ライトモードに切り替え" : "ダークモードに切り替え";
      }

      function setActiveTab(tab) {
        state.activeTab = tab;
        app.setAttribute("data-active-tab", tab);

        tabs.forEach((button) => {
          const isActive = button.dataset.tab === tab;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-selected", String(isActive));
        });

        saveState();
      }

      function updateButtons() {
        undoBtn.disabled = state.historyIndex <= 0;
        redoBtn.disabled = state.historyIndex >= state.history.length - 1;
      }

      function pushHistory(value) {
        if (state.history[state.historyIndex] === value) return;

        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(value);
        if (state.history.length > 80) {
          state.history.shift();
        }
        state.historyIndex = state.history.length - 1;
        updateButtons();
      }

      function applyHistory(index) {
        state.historyIndex = index;
        state.code = state.history[index];
        editor.value = state.code;
        renderPreview();
        saveState();
        updateButtons();
      }

      function renderPreview() {
        previewFrame.srcdoc = state.code;
      }

      async function copyAll() {
        const text = state.code;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "✅";
          copyBtn.classList.add("primary");
          setTimeout(() => {
            copyBtn.textContent = "📝";
          }, 800);
        } catch (error) {
          editor.focus();
          editor.select();
          document.execCommand("copy");
          copyBtn.textContent = "✅";
          setTimeout(() => {
            copyBtn.textContent = "📝";
          }, 800);
        }
      }

      function init() {
        loadState();

        state.history = [state.code];
        state.historyIndex = 0;

        editor.value = state.code;
        updateThemeUI();
        setActiveTab(state.activeTab);
        renderPreview();
        updateButtons();

        editor.addEventListener("input", () => {
          const nextCode = editor.value;
          state.code = nextCode;
          pushHistory(nextCode);
          renderPreview();
          saveState();
        });

        undoBtn.addEventListener("click", () => {
          if (state.historyIndex <= 0) return;
          applyHistory(state.historyIndex - 1);
        });

        redoBtn.addEventListener("click", () => {
          if (state.historyIndex >= state.history.length - 1) return;
          applyHistory(state.historyIndex + 1);
        });

        copyBtn.addEventListener("click", copyAll);

        themeBtn.addEventListener("click", () => {
          state.theme = state.theme === "dark" ? "light" : "dark";
          updateThemeUI();
          saveState();
        });

        tabs.forEach((button) => {
          button.addEventListener("click", () => {
            setActiveTab(button.dataset.tab);
          });
        });

        window.addEventListener("beforeunload", saveState);
      }

      init();
    })();
  </script>
</body>
</html>
